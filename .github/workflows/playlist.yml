name: Playlist del grupo
on:
  schedule:
    - cron: '17 */2 * * *'   # cada 2 horas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer la playlist de Spotify
        run: python3 scripts/playlist.py
      - name: Guardar si cambió
        run: |
          if [ -n "$(git status --porcelain musica.json)" ]; then
            git config user.name "playlist-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add musica.json
            git commit -m "Playlist actualizada"
            git push
          else
            echo "Sin cambios"
          fi
