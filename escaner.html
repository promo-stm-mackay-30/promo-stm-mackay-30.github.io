<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acceso de staff · Prom Party G'30</title>
<meta name="theme-color" content="#070a1c">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  .modos { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; margin-bottom:1rem; }
  .modos button { font:inherit; font-weight:800; font-size:1rem; color:var(--texto); cursor:pointer; padding:.9rem; border-radius:1rem; border:2px solid var(--borde); background:var(--vidrio); transition:.15s; }
  .modos button.activo.e { background:rgba(46,229,157,.18); border-color:var(--ok); }
  .modos button.activo.s { background:rgba(245,166,35,.18); border-color:var(--oro); }
  #lector { width:100%; border-radius:1.2rem; overflow:hidden; background:#000; min-height:14rem; border:1px solid var(--borde); }
  .contadores { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; margin-bottom:1rem; text-align:center; }
  .contadores div { background:var(--vidrio); border:1px solid var(--borde); border-radius:.9rem; padding:.6rem 0; }
  .contadores b { display:block; font-size:1.6rem; }
  .contadores span { font-size:.65rem; text-transform:uppercase; letter-spacing:.12em; color:var(--suave); }
  .resultado { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:1.2rem; background:rgba(4,6,18,.9); backdrop-filter:blur(8px); }
  .resultado .caja { width:min(100%,28rem); text-align:center; border-radius:1.6rem; padding:1.6rem 1.2rem; border:3px solid; background:#0c1230; }
  .resultado.ok .caja { border-color:var(--ok); box-shadow:0 0 4rem rgba(46,229,157,.4); }
  .resultado.mal .caja { border-color:var(--mal); box-shadow:0 0 4rem rgba(255,90,110,.4); }
  .resultado.conf .caja { border-color:var(--oro); box-shadow:0 0 4rem rgba(245,166,35,.35); }
  .resultado .ico { font-size:3.6rem; }
  .resultado h2 { font-size:1.5rem; margin:.3rem 0; }
  .resultado .alu { font-size:1.2rem; font-weight:700; }
  .resultado .sub { margin:.2rem 0 1rem; }
  .persona { display:block; width:100%; text-align:left; font:inherit; color:var(--texto); cursor:pointer; padding:.8rem 1rem; margin-bottom:.55rem; border-radius:.9rem; border:1px solid var(--borde); background:rgba(255,255,255,.07); }
  .persona:active { background:rgba(46,229,157,.25); }
  .persona small { display:block; color:var(--suave); }
  .persona.no { border-color:var(--mal); color:#ffd0d6; text-align:center; font-weight:700; }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="contenedor">
  <a class="volver" href="./">← Inicio</a>
  <h1>Acceso de staff</h1>

  <section id="login" class="tarjeta">
    <h2>Ingreso</h2>
    <p class="msg mal oculto" id="loginError"></p>
    <label for="pin">PIN del staff</label>
    <input type="password" id="pin" autocomplete="off" inputmode="text">
    <div style="height:1rem"></div>
    <button class="btn" id="entrar" type="button">Entrar</button>
  </section>

  <section id="panel" class="oculto">
    <div class="contadores">
      <div><b id="cDentro">–</b><span>Dentro</span></div>
      <div><b id="cRetirados">–</b><span>Retirados</span></div>
      <div><b id="cRegistrados">–</b><span>Registrados</span></div>
    </div>
    <div class="modos">
      <button type="button" id="mE" class="activo e">⬇ ENTRADA</button>
      <button type="button" id="mS" class="s">⬆ SALIDA</button>
    </div>
    <div id="lector"></div>
    <p class="sub" style="margin-top:.8rem;text-align:center">Apunta la cámara al QR del pase.</p>
    <button class="btn sec" id="salir" type="button" style="margin-top:.6rem">Cerrar sesión</button>
  </section>
</main>

<div id="resultado" class="resultado oculto"><div class="caja" id="caja"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const API = window.API_URL;
let pin = "", modo = "entrada", lector = null, ocupado = false, ultimo = { t: "", at: 0 };

try { pin = sessionStorage.getItem("pin_g30") || ""; } catch (_) {}

async function api(body) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ pin }, body)) });
  return r.json();
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* sonido y vibración */
function pitar(ok) {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.type = "sine"; o.frequency.value = ok ? 880 : 220; g.gain.value = .15;
    o.start(); o.stop(a.currentTime + (ok ? .15 : .45));
  } catch (_) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [200, 80, 200]);
}

function mostrar(tipo, html) {
  $("resultado").className = "resultado " + tipo;
  $("caja").innerHTML = html;
}
function cerrar() { $("resultado").className = "resultado oculto"; ocupado = false; }

async function contadores() {
  try {
    const r = await api({ accion: "presentes" });
    if (r.auth === false) return cerrarSesion();
    if (r.ok) { $("cDentro").textContent = r.dentro; $("cRetirados").textContent = r.retirados; $("cRegistrados").textContent = r.registrados; }
  } catch (_) {}
}

async function alLeer(token) {
  const ahora = Date.now();
  if (ocupado || (token === ultimo.t && ahora - ultimo.at < 4000)) return;
  ocupado = true; ultimo = { t: token, at: ahora };
  mostrar("conf", '<div class="ico">⏳</div><h2>Verificando…</h2>');
  try {
    const r = await api({ accion: "escanear", token, modo });
    if (r.auth === false) return cerrarSesion();
    if (r.requiere === "confirmar") {
      pitar(true);
      mostrar("conf", `<div class="ico">🧑‍🤝‍🧑</div><h2>${esc(r.alumno)}</h2><p class="sub">${esc(r.curso)} · Cupo ${esc(r.folio)}<br>¿Quién retira al alumno? Verifica su identidad.</p>`
        + r.personas.map(p => `<button class="persona" data-i="${p.i}"><b>${esc(p.nombre)}</b><small>${esc(p.rol)} · ${esc(p.tel)}</small></button>`).join("")
        + `<button class="persona no" data-i="NO">❌ La persona NO coincide</button>`
        + `<button class="persona" data-cancel="1" style="text-align:center;opacity:.8">Cancelar</button>`);
      document.querySelectorAll("#caja .persona").forEach(b => b.onclick = () => {
        if (b.dataset.cancel) return cerrar();
        retirar(token, b.dataset.i);
      });
      return;
    }
    pitar(r.ok);
    mostrar(r.ok ? "ok" : "mal",
      `<div class="ico">${r.ok ? "✅" : "⛔"}</div><h2>${esc(r.msg)}</h2>`
      + (r.alumno ? `<p class="alu">${esc(r.alumno)}</p><p class="sub">${esc(r.curso)} · Cupo ${esc(r.folio)}</p>` : "")
      + `<button class="btn" id="ok" type="button">Continuar</button>`);
    $("ok").onclick = cerrar; contadores();
  } catch (_) {
    pitar(false);
    mostrar("mal", `<div class="ico">📡</div><h2>Sin conexión</h2><p class="sub">No se registró nada. Intenta de nuevo.</p><button class="btn" id="ok" type="button">Continuar</button>`);
    $("ok").onclick = cerrar;
  }
}

async function retirar(token, quien) {
  mostrar("conf", '<div class="ico">⏳</div><h2>Guardando…</h2>');
  try {
    const r = await api({ accion: "retirar", token, quien });
    pitar(r.ok);
    mostrar(r.ok ? "ok" : "mal",
      `<div class="ico">${r.ok ? "✅" : "⛔"}</div><h2>${esc(r.msg)}</h2>`
      + (r.ok ? `<p class="alu">${esc(r.alumno)}</p><p class="sub">Retirado por ${esc(r.retiradoPor)}</p>` : "")
      + `<button class="btn" id="ok" type="button">Continuar</button>`);
    $("ok").onclick = cerrar; contadores();
  } catch (_) {
    mostrar("mal", `<div class="ico">📡</div><h2>Sin conexión</h2><p class="sub">No se registró la salida. Vuelve a escanear.</p><button class="btn" id="ok" type="button">Continuar</button>`);
    $("ok").onclick = cerrar;
  }
}

async function iniciarLector() {
  if (lector) return;
  lector = new Html5Qrcode("lector");
  try {
    await lector.start({ facingMode: "environment" }, { fps: 10, qrbox: (w, h) => { const l = Math.min(w, h) * .75; return { width: l, height: l }; } },
      txt => alLeer(txt.trim()), () => {});
  } catch (_) {
    $("lector").innerHTML = '<p class="msg mal" style="margin:1rem">No se pudo abrir la cámara. Da permiso de cámara al navegador.</p>';
  }
}
async function detenerLector() { if (lector) { try { await lector.stop(); } catch (_) {} lector = null; } }

function entrarPanel() {
  $("login").classList.add("oculto"); $("panel").classList.remove("oculto");
  iniciarLector(); contadores(); clearInterval(window._c); window._c = setInterval(contadores, 8000);
}
function cerrarSesion() {
  pin = ""; try { sessionStorage.removeItem("pin_g30"); } catch (_) {}
  clearInterval(window._c); detenerLector(); cerrar();
  $("panel").classList.add("oculto"); $("login").classList.remove("oculto");
  $("pin").value = "";
}

$("entrar").onclick = async () => {
  const e = $("loginError"); e.classList.add("oculto");
  if (!API) { e.textContent = "El sistema todavía no está habilitado (en construcción)."; e.classList.remove("oculto"); return; }
  pin = $("pin").value.trim(); if (!pin) return;
  const b = $("entrar"); b.disabled = true; b.textContent = "Verificando…";
  try {
    const r = await api({ accion: "presentes" });
    if (r.ok) { try { sessionStorage.setItem("pin_g30", pin); } catch (_) {} entrarPanel(); }
    else { e.textContent = "PIN incorrecto."; e.classList.remove("oculto"); pin = ""; }
  } catch (_) { e.textContent = "Sin conexión con el servidor."; e.classList.remove("oculto"); }
  b.disabled = false; b.textContent = "Entrar";
};
$("pin").addEventListener("keydown", ev => { if (ev.key === "Enter") $("entrar").click(); });
$("salir").onclick = cerrarSesion;
$("mE").onclick = () => { modo = "entrada"; $("mE").className = "activo e"; $("mS").className = "s"; };
$("mS").onclick = () => { modo = "salida"; $("mS").className = "activo s"; $("mE").className = "e"; };

if (pin && API) entrarPanel();
</script>
</body>
</html>
